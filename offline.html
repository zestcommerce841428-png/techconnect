<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're offline — PuchoNow</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1.5rem; }
  @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f1f5f9; } .card { background: #1e293b !important; border-color: #334155 !important; } }
  .card { max-width: 26rem; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 2.5rem 2rem; }
  .icon { font-size: 2.75rem; margin-bottom: .5rem; }
  h1 { font-size: 1.25rem; margin: .25rem 0 .5rem; }
  p { color: #64748b; line-height: 1.5; margin: 0 0 1.5rem; }
  button { background: #4f46e5; color: #fff; border: 0; font-size: .9rem; font-weight: 500; padding: .6rem 1.2rem; border-radius: .5rem; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>PuchoNow needs an internet connection. Pages you visited recently may still open. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
